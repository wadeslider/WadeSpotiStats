<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WadeSpotiStats - Kenia Os</title>
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22WadeSpotiStats%22%2C%22short_name%22%3A%22SpotiStats%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230b0b10%22%2C%22theme_color%22%3A%22%2300a8ff%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22public%2Fpng%2Ficon.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
  <meta name="theme-color" content="#00a8ff">
  
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Chart.js para las gráficas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="public/css/index.css">
</head>
<body>

  <header>
    <div class="top-bar">
      <h1><i class="fa-brands fa-spotify"></i> WadeSpotiStats</h1>
      <div class="header-actions">
        <button class="btn-secondary-btn" id="syncBtn" onclick="manualSyncAllSongs()"><i class="fa-solid fa-rotate"></i> Sincronizar</button>
        <button class="btn-secondary-btn" onclick="exportJSON()"><i class="fa-solid fa-download"></i> Backup</button>
        <button class="btn-secondary-btn" onclick="document.getElementById('fileInput').click()"><i class="fa-solid fa-upload"></i> Cargar</button>
        <input type="file" id="fileInput" accept=".json,application/json" onchange="importJSON(event)">
        <button class="btn-main" onclick="openModal()"><i class="fa-solid fa-plus"></i> Nueva</button>
      </div>
    </div>
  </header>

  <!-- PANEL DE ESTADÍSTICAS -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-val" id="statCount">0</div>
      <div class="stat-label">Canciones</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="statTop" style="font-size:0.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">-</div>
      <div class="stat-label">Top #1</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="statTotalStreams">0</div>
      <div class="stat-label">Streams Totales</div>
    </div>
  </div>

  <div class="controls-panel">
    <div class="search-sort-bar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Buscar canción, artista o álbum..." oninput="renderSongs()">
      </div>

      <select id="sortSelect" onchange="renderSongs()">
        <option value="streams-desc">Más reproducidas</option>
        <option value="streams-asc">Menos reproducidas</option>
        <option value="date-desc">Más recientes</option>
        <option value="date-asc">Más viejas</option>
        <option value="alpha-asc">A - Z</option>
        <option value="alpha-desc">Z - A</option>
      </select>

      <div class="view-toggles">
        <button class="view-btn" id="btnGrid" onclick="setView('grid')" title="Cuadrícula"><i class="fa-solid fa-border-all"></i></button>
        <button class="view-btn" id="btnHorizontal" onclick="setView('horizontal')" title="Tarjetas Acostadas"><i class="fa-solid fa-list-ul"></i></button>
        <button class="view-btn" id="btnList" onclick="setView('list')" title="Lista Tabla"><i class="fa-solid fa-table-list"></i></button>
        <button class="view-btn active" id="btnPlaylist" onclick="setView('playlist')" title="Estilo Playlist Spotify"><i class="fa-brands fa-spotify"></i></button>
      </div>
    </div>
  </div>

  <div class="container">
    <div id="songsContainer"></div>
  </div>

  <!-- MODAL DE EDICIÓN Y CREACIÓN CON API ITUNES -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Agregar Canción</h3>
        <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="itunes-search-section">
        <label style="font-size:0.78rem; color: var(--accent); font-weight:bold;">✨ Auto-completar datos desde iTunes</label>
        <div class="itunes-search-box">
          <input type="text" id="itunesQuery" placeholder="Ej: Por Siempre Kenia Os o enlace">
          <button type="button" class="btn-main" style="padding: 8px 12px; font-size:0.75rem;" onclick="searchITunes()"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
        </div>
        <div class="itunes-results" id="itunesResults"></div>
      </div>

      <form id="songForm" onsubmit="saveSong(event)">
        <input type="hidden" id="songId">

        <div class="form-group">
          <label>Título de la Canción *</label>
          <input type="text" id="titleInput" required placeholder="Ej: Por Siempre">
        </div>

        <div class="form-group">
          <label>Artista(s) *</label>
          <input type="text" id="artistInput" value="Kenia Os" required placeholder="Kenia Os">
        </div>

        <div class="form-group">
          <label>Álbum / Lanzamiento</label>
          <input type="text" id="albumInput" placeholder="Ej: Cambios de Luna">
        </div>

        <div class="form-group">
          <label>Tipo de Lanzamiento</label>
          <select id="typeInput">
            <option value="Sencillo">Sencillo</option>
            <option value="Álbum">Álbum</option>
            <option value="EP">EP</option>
          </select>
        </div>

        <div class="form-group">
          <label>Reproducciones Totales (Exactas) *</label>
          <input type="number" id="streamsInput" required placeholder="Ej: 400000000">
        </div>

        <div class="form-group">
          <label>Fecha de Lanzamiento</label>
          <input type="date" id="dateInput">
        </div>

        <div class="form-group">
          <label>URL de Portada (HD)</label>
          <input type="url" id="coverInput" placeholder="https://...">
        </div>

        <div class="form-group">
          <label>URL de Enlace de Spotify *</label>
          <input type="url" id="linkInput" placeholder="https://open.spotify.com/track/...">
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn-main">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL INTERACTIVO DE DETALLES Y GRÁFICA HORARIA (MÁXIMO 5 HORAS) -->
  <div class="modal-overlay" id="detailModalOverlay">
    <div class="modal" style="max-width: 600px;">
      <div class="modal-header">
        <h3 id="detailModalTitle"><i class="fa-solid fa-chart-line" style="color:var(--accent);"></i> Evolución de Streams (Últimas 5 horas)</h3>
        <button class="close-modal" onclick="closeDetailModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      
      <div id="songDetailContent" style="display: flex; flex-direction: column; gap: 15px;">
        <div style="display: flex; gap: 12px; align-items: center;">
          <img id="detailCover" src="" alt="" style="width: 70px; height: 70px; border-radius: 8px; object-fit: cover;">
          <div>
            <div id="detailSongTitle" style="font-weight: bold; font-size: 1.1rem; color: white;"></div>
            <div id="detailSongArtist" style="font-size: 0.85rem; color: var(--text-sub);"></div>
            <div id="detailSongStreams" class="streams-text" style="margin-top: 4px; font-size: 1rem;"></div>
          </div>
        </div>

        <div style="background: #0e0e14; padding: 12px; border-radius: 8px; border: 1px solid var(--border-color);">
          <div style="font-size: 0.8rem; color: var(--text-sub); margin-bottom: 8px; display: flex; justify-content: space-between;">
            <span>📈 Historial deslizante (Máximo 5 registros)</span>
            <span style="font-size: 0.75rem; color: var(--accent);">Optimizado</span>
          </div>
          <div style="position: relative; height: 220px; width: 100%;">
            <canvas id="streamsChart"></canvas>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
          <a id="detailSpotifyLink" href="#" target="_blank" class="btn-main" style="text-decoration: none; font-size: 0.8rem; background-color: var(--green-spotify);">
            <i class="fa-brands fa-spotify"></i> Escuchar en Spotify
          </a>
          <button type="button" class="btn-secondary" onclick="closeDetailModal()">Cerrar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="public/js/index.js"></script>
</body>
</html>
