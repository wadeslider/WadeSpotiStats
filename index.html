<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WadeSpotiStats - Kenia Os</title>
  <!-- CONFIGURACIÓN PWA PARA INSTALAR COMO APP -->
  <link rel="manifest" href="data:application/manifest+json;charset=utf-8,%7B%22name%22%3A%22WadeSpotiStats%22%2C%22short_name%22%3A%22SpotiStats%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%230b0b10%22%2C%22theme_color%22%3A%22%23ff2d75%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fcdn-icons-png.flaticon.com%2F512%2F2111%2F2111624.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">
  <meta name="theme-color" content="#ff2d75">
  
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0b10;
      --card-bg: #121218;
      --card-hover: #1e1e28;
      --accent: #ff2d75;
      --accent-hover: #e02463;
      --text-main: #ffffff;
      --text-sub: #a0a0b0;
      --border-color: #262635;
      --green-spotify: #1db954;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding-bottom: 60px; min-height: 100vh; }

    header {
      background: linear-gradient(180deg, #2b0816 0%, var(--bg-color) 100%);
      padding: 24px 20px 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .top-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    h1 { font-size: 1.5rem; font-weight: 800; display: flex; align-items: center; gap: 10px; color: #fff; }
    h1 i { color: var(--accent); }

    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-main {
      background-color: var(--accent); color: white; border: none; padding: 10px 16px;
      border-radius: 20px; font-weight: bold; cursor: pointer; display: flex; align-items: center;
      gap: 8px; font-size: 0.85rem; transition: 0.2s;
    }
    .btn-main:hover { background-color: var(--accent-hover); transform: scale(1.02); }

    .btn-secondary-btn {
      background: #1f1f2e; color: var(--text-sub); border: 1px solid var(--border-color);
      padding: 10px 14px; border-radius: 20px; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: 6px; font-size: 0.8rem; transition: 0.2s;
    }
    .btn-secondary-btn:hover { color: white; border-color: #444; }

    /* ESTADÍSTICAS */
    .stats-bar {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; padding: 0 20px 15px;
    }
    .stat-card {
      background: var(--card-bg); border: 1px solid var(--border-color); padding: 10px;
      border-radius: 10px; text-align: center;
    }
    .stat-val { font-size: 1rem; font-weight: bold; color: var(--accent); }
    .stat-label { font-size: 0.7rem; color: var(--text-sub); margin-top: 2px; }

    .controls-panel { padding: 0 20px; margin-bottom: 20px; }
    .search-sort-bar { display: flex; gap: 10px; flex-wrap: wrap; }

    .search-box { flex: 1; min-width: 180px; position: relative; }
    .search-box input {
      width: 100%; background: #181822; border: 1px solid var(--border-color); color: white;
      padding: 10px 12px 10px 38px; border-radius: 8px; outline: none; font-size: 0.9rem;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-sub); }

    select {
      background: #181822; color: white; border: 1px solid var(--border-color);
      padding: 10px; border-radius: 8px; outline: none; cursor: pointer; font-size: 0.85rem;
    }

    .view-toggles { display: flex; gap: 4px; background: #181822; padding: 3px; border-radius: 8px; border: 1px solid var(--border-color); }
    .view-btn { background: transparent; border: none; color: var(--text-sub); padding: 8px 12px; border-radius: 6px; cursor: pointer; }
    .view-btn.active { background: var(--accent); color: white; }

    .container { padding: 0 20px; }

    /* VISTAS */
    .grid-view { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
    .song-card {
      background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px;
      padding: 12px; position: relative; display: flex; flex-direction: column; transition: 0.2s;
    }
    .song-card:hover { background: var(--card-hover); border-color: #333; }
    .img-container { position: relative; width: 100%; padding-top: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 10px; background: #222; }
    .img-container img { position: absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; }

    .card-title { font-size: 0.9rem; font-weight: bold; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-title a { color: white; text-decoration: none; }
    .card-title a:hover { text-decoration: underline; }
    .card-artist { font-size: 0.78rem; color: var(--text-sub); margin-bottom: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-info { font-size: 0.75rem; color: var(--text-sub); display: flex; justify-content: space-between; align-items: center; }

    .card-actions { position: absolute; top: 16px; right: 16px; display: flex; gap: 4px; background: rgba(0,0,0,0.75); padding: 4px; border-radius: 20px; }
    .action-btn { background: none; border: none; color: white; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.75rem; }
    .action-btn:hover { background: rgba(255,255,255,0.25); }

    .horizontal-view { display: flex; flex-direction: column; gap: 10px; }
    .h-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; display: flex; align-items: center; gap: 12px; }
    .h-card .img-container { width: 50px; height: 50px; min-width: 50px; padding-top: 0; margin-bottom: 0; }
    .h-details { flex: 1; min-width: 0; }
    .h-title { font-weight: bold; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .h-title a { color: white; text-decoration: none; }
    .h-artist { font-size: 0.78rem; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .h-meta { font-size: 0.72rem; color: var(--text-sub); margin-top: 2px; }
    .h-actions { display: flex; gap: 4px; }

    .table-wrapper { overflow-x: auto; }
    .list-view-table { width: 100%; border-collapse: collapse; min-width: 500px; }
    .list-view-table th { text-align: left; padding: 10px; color: var(--text-sub); font-size: 0.75rem; border-bottom: 1px solid var(--border-color); }
    .list-view-table td { padding: 10px; vertical-align: middle; border-bottom: 1px solid #181822; font-size: 0.85rem; }
    .list-view-table tr:hover { background: var(--card-hover); }

    .table-song-cell { display: flex; align-items: center; gap: 10px; }
    .table-thumb { width: 38px; height: 38px; min-width: 38px; border-radius: 4px; object-fit: cover; }
    .streams-text { font-family: monospace; font-size: 0.88rem; font-weight: bold; color: var(--green-spotify); }

    /* MODAL CON BUSCADOR ITUNES */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 15px; }
    .modal { background: #161620; border: 1px solid var(--border-color); padding: 20px; border-radius: 12px; width: 100%; max-width: 460px; max-height: 90vh; overflow-y: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .close-modal { background: none; border: none; color: var(--text-sub); font-size: 1.2rem; cursor: pointer; }

    .itunes-search-section { background: #0e0e14; border: 1px dashed var(--accent); padding: 12px; border-radius: 8px; margin-bottom: 15px; }
    .itunes-search-box { display: flex; gap: 8px; margin-top: 6px; }
    .itunes-search-box input { flex: 1; }

    .itunes-results { margin-top: 10px; max-height: 140px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    .itunes-item { display: flex; align-items: center; gap: 10px; background: #181822; padding: 6px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
    .itunes-item:hover { border-color: var(--accent); background: #222230; }
    .itunes-item img { width: 34px; height: 34px; border-radius: 4px; object-fit: cover; }
    .itunes-item-info { flex: 1; min-width: 0; }
    .itunes-item-title { font-size: 0.8rem; font-weight: bold; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .itunes-item-sub { font-size: 0.7rem; color: var(--text-sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 0.78rem; color: var(--text-sub); margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; background: #0e0e14; border: 1px solid var(--border-color); color: white; padding: 10px; border-radius: 6px; outline: none; font-size: 0.88rem; }
    .form-group input:focus { border-color: var(--accent); }

    .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
    .btn-secondary { background: #222230; color: white; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }

    #fileInput { display: none; }
  </style>
</head>
<body>

  <header>
    <div class="top-bar">
      <h1><i class="fa-brands fa-spotify"></i> WadeSpotiStats</h1>
      <div class="header-actions">
        <button class="btn-secondary-btn" onclick="exportJSON()"><i class="fa-solid fa-download"></i> Backup</button>
        <button class="btn-secondary-btn" onclick="document.getElementById('fileInput').click()"><i class="fa-solid fa-upload"></i> Cargar</button>
        <input type="file" id="fileInput" accept=".json" onchange="importJSON(event)">
        <button class="btn-main" onclick="openModal()"><i class="fa-solid fa-plus"></i> Nueva</button>
      </div>
    </div>
  </header>

  <!-- PANEL DE ESTADÍSTICAS -->
  <div class="stats-bar">
    <div class="stat-card">
      <div class="stat-val" id="statCount">0</div>
      <div class="stat-label">Canciones</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="statTop" style="font-size:0.85rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">-</div>
      <div class="stat-label">Top #1</div>
    </div>
    <div class="stat-card">
      <div class="stat-val" id="statTotalStreams">0</div>
      <div class="stat-label">Streams Totales</div>
    </div>
  </div>

  <div class="controls-panel">
    <div class="search-sort-bar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Buscar canción, artista o álbum..." oninput="renderSongs()">
      </div>

      <select id="sortSelect" onchange="renderSongs()">
        <option value="streams-desc">Más reproducidas</option>
        <option value="streams-asc">Menos reproducidas</option>
        <option value="date-desc">Más recientes</option>
        <option value="date-asc">Más viejas</option>
        <option value="alpha-asc">A - Z</option>
        <option value="alpha-desc">Z - A</option>
      </select>

      <div class="view-toggles">
        <button class="view-btn active" id="btnGrid" onclick="setView('grid')" title="Cuadrícula"><i class="fa-solid fa-border-all"></i></button>
        <button class="view-btn" id="btnHorizontal" onclick="setView('horizontal')" title="Tarjetas Acostadas"><i class="fa-solid fa-list-ul"></i></button>
        <button class="view-btn" id="btnList" onclick="setView('list')" title="Lista Tabla"><i class="fa-solid fa-table-list"></i></button>
      </div>
    </div>
  </div>

  <div class="container">
    <div id="songsContainer"></div>
  </div>

  <!-- MODAL DE EDICIÓN Y CREACIÓN CON API ITUNES -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Agregar Canción</h3>
        <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- SECCIÓN API ITUNES -->
      <div class="itunes-search-section">
        <label style="font-size:0.78rem; color: var(--accent); font-weight:bold;">✨ Auto-completar desde iTunes API</label>
        <div class="itunes-search-box">
          <input type="text" id="itunesQuery" placeholder="Ej: Por Siempre Kenia Os">
          <button type="button" class="btn-main" style="padding: 8px 12px; font-size:0.75rem;" onclick="searchITunes()"><i class="fa-solid fa-magnifying-glass"></i> Buscar</button>
        </div>
        <div class="itunes-results" id="itunesResults"></div>
      </div>

      <form id="songForm" onsubmit="saveSong(event)">
        <input type="hidden" id="songId">

        <div class="form-group">
          <label>Título de la Canción *</label>
          <input type="text" id="titleInput" required placeholder="Ej: Por Siempre">
        </div>

        <div class="form-group">
          <label>Artista(s) *</label>
          <input type="text" id="artistInput" value="Kenia Os" required placeholder="Kenia Os">
        </div>

        <div class="form-group">
          <label>Álbum / Lanzamiento</label>
          <input type="text" id="albumInput" placeholder="Ej: Cambios de Luna">
        </div>

        <div class="form-group">
          <label>Tipo de Lanzamiento</label>
          <select id="typeInput">
            <option value="Sencillo">Sencillo</option>
            <option value="Álbum">Álbum</option>
            <option value="EP">EP</option>
          </select>
        </div>

        <div class="form-group">
          <label>Reproducciones Totales (Exactas) *</label>
          <input type="number" id="streamsInput" required placeholder="Ej: 400000000">
        </div>

        <div class="form-group">
          <label>Fecha de Lanzamiento</label>
          <input type="date" id="dateInput">
        </div>

        <div class="form-group">
          <label>URL de Portada (HD)</label>
          <input type="url" id="coverInput" placeholder="https://...">
        </div>

        <div class="form-group">
          <label>URL de Enlace (Apple / Spotify)</label>
          <input type="url" id="linkInput" placeholder="https://...">
        </div>

        <div class="modal-footer">
          <button type="button" class="btn-secondary" onclick="closeModal()">Cancelar</button>
          <button type="submit" class="btn-main">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let songs = JSON.parse(localStorage.getItem('wadespotistats_songs')) || [];
    let currentView = 'grid';

    function saveToStorage() {
      localStorage.setItem('wadespotistats_songs', JSON.stringify(songs));
      updateStats();
    }

    function formatNumber(num) {
      return Number(num).toLocaleString('es-MX');
    }

    function updateStats() {
      document.getElementById('statCount').innerText = songs.length;
      const totalStreams = songs.reduce((sum, s) => sum + (parseInt(s.streams) || 0), 0);
      document.getElementById('statTotalStreams').innerText = formatNumber(totalStreams);

      if(songs.length > 0) {
        const topSong = [...songs].sort((a,b) => b.streams - a.streams)[0];
        document.getElementById('statTop').innerText = topSong.title;
      } else {
        document.getElementById('statTop').innerText = '-';
      }
    }

    function setView(view) {
      currentView = view;
      document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
      if(view === 'grid') document.getElementById('btnGrid').classList.add('active');
      if(view === 'horizontal') document.getElementById('btnHorizontal').classList.add('active');
      if(view === 'list') document.getElementById('btnList').classList.add('active');
      renderSongs();
    }

    function openModal(id = null) {
      const modal = document.getElementById('modalOverlay');
      const form = document.getElementById('songForm');
      document.getElementById('itunesResults').innerHTML = '';
      document.getElementById('itunesQuery').value = '';
      modal.style.display = 'flex';

      if (id !== null) {
        document.getElementById('modalTitle').innerText = 'Editar Canción';
        const song = songs.find(s => s.id === id);
        document.getElementById('songId').value = song.id;
        document.getElementById('titleInput').value = song.title;
        document.getElementById('artistInput').value = song.artist || 'Kenia Os';
        document.getElementById('albumInput').value = song.album;
        document.getElementById('typeInput').value = song.type;
        document.getElementById('streamsInput').value = song.streams;
        document.getElementById('dateInput').value = song.date;
        document.getElementById('coverInput').value = song.cover;
        document.getElementById('linkInput').value = song.link;
      } else {
        document.getElementById('modalTitle').innerText = 'Agregar Canción';
        form.reset();
        document.getElementById('songId').value = '';
        document.getElementById('artistInput').value = 'Kenia Os';
      }
    }

    function closeModal() {
      document.getElementById('modalOverlay').style.display = 'none';
    }

    function searchITunes() {
      const query = document.getElementById('itunesQuery').value;
      if (!query) return;
      const resultsDiv = document.getElementById('itunesResults');
      resultsDiv.innerHTML = '<p style="font-size:0.75rem; color:var(--text-sub);">Buscando en iTunes...</p>';

      const script = document.createElement('script');
      script.src = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=5&callback=handleITunesResponse`;
      document.body.appendChild(script);
    }

    function handleITunesResponse(data) {
      const resultsDiv = document.getElementById('itunesResults');
      resultsDiv.innerHTML = '';
      if (!data.results || data.results.length === 0) {
        resultsDiv.innerHTML = '<p style="font-size:0.75rem; color:var(--text-sub);">Sin resultados.</p>';
        return;
      }

      data.results.forEach(item => {
        const coverHd = item.artworkUrl100 ? item.artworkUrl100.replace('100x100bb', '1000x1000bb') : '';
        const releaseDate = item.releaseDate ? item.releaseDate.split('T')[0] : '';
        const el = document.createElement('div');
        el.className = 'itunes-item';
        el.innerHTML = `
          <img src="${item.artworkUrl60}" alt="">
          <div class="itunes-item-info">
            <div class="itunes-item-title">${item.trackName}</div>
            <div class="itunes-item-sub">${item.artistName} • ${item.collectionName || 'Sencillo'}</div>
          </div>
        `;
        el.onclick = () => {
          document.getElementById('titleInput').value = item.trackName;
          document.getElementById('artistInput').value = item.artistName;
          document.getElementById('albumInput').value = item.collectionName || '';
          document.getElementById('coverInput').value = coverHd;
          document.getElementById('linkInput').value = item.trackViewUrl || '';
          if (releaseDate) document.getElementById('dateInput').value = releaseDate;
          resultsDiv.innerHTML = '<p style="font-size:0.75rem; color:var(--green-spotify);">¡Datos aplicados al formulario!</p>';
        };
        resultsDiv.appendChild(el);
      });
    }

    function saveSong(e) {
      e.preventDefault();
      const id = document.getElementById('songId').value;
      const songData = {
        id: id ? parseInt(id) : Date.now(),
        title: document.getElementById('titleInput').value,
        artist: document.getElementById('artistInput').value || 'Kenia Os',
        album: document.getElementById('albumInput').value || 'Sin Álbum',
        type: document.getElementById('typeInput').value,
        streams: parseInt(document.getElementById('streamsInput').value) || 0,
        date: document.getElementById('dateInput').value || '',
        cover: document.getElementById('coverInput').value || 'https://via.placeholder.com/300/181822/ffffff?text=Portada',
        link: document.getElementById('linkInput').value || '#'
      };

      if (id) {
        const index = songs.findIndex(s => s.id === parseInt(id));
        songs[index] = songData;
      } else {
        songs.push(songData);
      }

      saveToStorage();
      closeModal();
      renderSongs();
    }

    function deleteSong(id) {
      if (confirm('¿Eliminar esta canción de tu lista?')) {
        songs = songs.filter(s => s.id !== id);
        saveToStorage();
        renderSongs();
      }
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(songs, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "WadeSpotiStats_Backup.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          if (Array.isArray(imported)) {
            songs = imported;
            saveToStorage();
            renderSongs();
            alert('¡Datos cargados con éxito!');
          }
        } catch (err) {
          alert('Error al leer el archivo JSON.');
        }
      };
      reader.readAsText(file);
    }

    function getFilteredAndSortedSongs() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const sort = document.getElementById('sortSelect').value;

      let filtered = songs.filter(s => 
        s.title.toLowerCase().includes(query) ||
        s.artist.toLowerCase().includes(query) ||
        s.album.toLowerCase().includes(query)
      );

      return filtered.sort((a, b) => {
        if (sort === 'streams-desc') return b.streams - a.streams;
        if (sort === 'streams-asc') return a.streams - b.streams;
        if (sort === 'date-desc') return new Date(b.date || 0) - new Date(a.date || 0);
        if (sort === 'date-asc') return new Date(a.date || 0) - new Date(b.date || 0);
        if (sort === 'alpha-asc') return a.title.localeCompare(b.title);
        if (sort === 'alpha-desc') return b.title.localeCompare(a.title);
      });
    }

    function renderSongs() {
      const container = document.getElementById('songsContainer');
      const list = getFilteredAndSortedSongs();

      if (list.length === 0) {
        container.innerHTML = `<p style="text-align:center; color: var(--text-sub); padding: 50px 0;">No hay canciones en tu catálogo.<br>Presiona "+ Nueva" para agregar la primera.</p>`;
        return;
      }

      if (currentView === 'grid') {
        container.className = 'grid-view';
        container.innerHTML = list.map(s => `
          <div class="song-card">
            <div class="card-actions">
              <button class="action-btn" onclick="openModal(${s.id})" title="Editar"><i class="fa-solid fa-pen"></i></button>
              <button class="action-btn" onclick="deleteSong(${s.id})" title="Eliminar"><i class="fa-solid fa-trash"></i></button>
            </div>
            <div class="img-container">
              <img src="${s.cover}" alt="${s.title}" onerror="this.src='https://via.placeholder.com/300/181822/ffffff?text=Portada'">
            </div>
            <div class="card-title"><a href="${s.link}" target="_blank">${s.title}</a></div>
            <div class="card-artist">${s.artist}</div>
            <div class="card-info">
              <span>${s.type}</span>
              <span class="streams-text">${formatNumber(s.streams)}</span>
            </div>
          </div>
        `).join('');
      } else if (currentView === 'horizontal') {
        container.className = 'horizontal-view';
        container.innerHTML = list.map(s => `
          <div class="h-card">
            <div class="img-container">
              <img src="${s.cover}" alt="${s.title}" onerror="this.src='https://via.placeholder.com/300/181822/ffffff?text=Portada'">
            </div>
            <div class="h-details">
              <div class="h-title"><a href="${s.link}" target="_blank">${s.title}</a></div>
              <div class="h-artist">${s.artist}</div>
              <div class="h-meta">${s.album} • ${s.type}</div>
            </div>
            <div style="text-align:right;">
              <div class="streams-text">${formatNumber(s.streams)}</div>
            </div>
            <div class="h-actions">
              <button class="action-btn" onclick="openModal(${s.id})"><i class="fa-solid fa-pen"></i></button>
              <button class="action-btn" onclick="deleteSong(${s.id})"><i class="fa-solid fa-trash"></i></button>
            </div>
          </div>
        `).join('');
      } else {
        container.className = '';
        container.innerHTML = `
          <div class="table-wrapper">
            <table class="list-view-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>Título / Artista</th>
                  <th>Álbum</th>
                  <th>Reproducciones exactas</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody>
                ${list.map((s, i) => `
                  <tr>
                    <td style="color:var(--text-sub); width: 25px;">${i + 1}</td>
                    <td>
                      <div class="table-song-cell">
                        <img class="table-thumb" src="${s.cover}" onerror="this.src='https://via.placeholder.com/300/181822/ffffff?text=Portada'">
                        <div>
                          <div style="font-weight:bold;"><a href="${s.link}" target="_blank" style="color:white; text-decoration:none;">${s.title}</a></div>
                          <div style="color:var(--text-sub); font-size:0.75rem;">${s.artist}</div>
                        </div>
                      </div>
                    </td>
                    <td style="color:var(--text-sub);">${s.album}</td>
                    <td><span class="streams-text">${formatNumber(s.streams)}</span></td>
                    <td>
                      <button class="action-btn" onclick="openModal(${s.id})"><i class="fa-solid fa-pen"></i></button>
                      <button class="action-btn" onclick="deleteSong(${s.id})"><i class="fa-solid fa-trash"></i></button>
                    </td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }
    }

    updateStats();
    renderSongs();
  </script>
</body>
</html>
